name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://iolvxwvjasawlnsxlmpi.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlvbHZ4d3ZqYXNhd2xuc3hsbXBpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NTE3OTUsImV4cCI6MjEwNDEyNzc5NX0.ZXDSu7yBu8h-loaoTkmWUUfmZgkRoMCX201LEJ9__rs' }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || '327072674404-1h805jh4loejfkqjgbjpma8gdcep1iaq.apps.googleusercontent.com' }}
          VITE_BACKEND_URL: 'https://appsportcalendar.vercel.app'
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant Gradle Execute Permission
        run: chmod +x android/gradlew

      - name: Build Android APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Versioned Release Assets
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD_NUM=${{ github.run_number }}
          TAG="v${VERSION}.${BUILD_NUM}"
          TITLE="Release v${VERSION} (Build #${BUILD_NUM})"
          APK_NAME="sport-calendar-v${VERSION}-b${BUILD_NUM}.apk"
          
          # Copy to versioned name and generic name in root
          cp android/app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "app-debug.apk"
          
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish Versioned GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 📱 Sport Calendar Android — ${{ steps.meta.outputs.title }}
            
            - **Version :** `${{ steps.meta.outputs.version }}`
            - **Numéro de build :** `#${{ github.run_number }}`
            - **Commit :** `${{ github.sha }}`
            - **Message du commit :** `${{ github.event.head_commit.message }}`
            - **Hôte de mise à jour live :** `https://appsportcalendar.vercel.app`
            
            ---
            #### 📥 Téléchargement direct pour votre téléphone :
            Cliquez sur **`${{ steps.meta.outputs.apk_name }}`** (ou **`app-debug.apk`**) ci-dessous pour l'installer sur votre téléphone Android.
          files: |
            ${{ steps.meta.outputs.apk_name }}
            app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
